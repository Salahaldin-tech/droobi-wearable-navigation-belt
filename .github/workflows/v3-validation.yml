name: V3 Flutter Validation

on:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-validation:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Repair QGIS project relative datasource paths
        run: python3 tooling/fix_qgis_project_paths.py

      - name: Commit the QGIS project path repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/campus_map_v3/AAUP_Campus_Network.qgz
          if ! git diff --cached --quiet; then
            git commit -m "fix(map): repair QGIS project relative data paths"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No QGIS project path repair needed."
          fi

      - name: Validate QGIS source, runtime exports and project paths
        run: |
          python3 tooling/validate_campus_map.py \
            --gpkg assets/campus_map_v3/campus_network.gpkg \
            --project assets/campus_map_v3/AAUP_Campus_Network.qgz \
            --export-dir docs/campus-mapping

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload the resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Parse and format changed navigation sources
        run: |
          dart format \
            lib/models/location_fix.dart \
            lib/services/location/location_service.dart \
            lib/services/location/gps_filter_service.dart \
            lib/services/location/position_filter_service.dart \
            lib/services/navigation/navigation_trace_logger.dart \
            lib/services/navigation/route_progress_service.dart \
            lib/services/navigation/navigation_service.dart \
            lib/services/routing/campus_graph_routing_service.dart \
            lib/screens/university/university_locations_screen.dart \
            lib/services/ble/belt_navigation_bridge.dart \
            lib/screens/navigation/live_navigation_screen.dart \
            lib/screens/test/live_navigation_test_screen.dart \
            test/campus_graph_routing_service_test.dart \
            test/route_progress_service_test.dart \
            test/gps_filter_service_test.dart \
            test/navigation_trace_logger_test.dart

      - name: Analyze V3-touched Dart sources
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/models/location_fix.dart \
            lib/services/location/location_service.dart \
            lib/services/location/gps_filter_service.dart \
            lib/services/location/position_filter_service.dart \
            lib/services/navigation/navigation_trace_logger.dart \
            lib/services/navigation/route_progress_service.dart \
            lib/services/navigation/navigation_service.dart \
            lib/services/routing/campus_graph_routing_service.dart \
            lib/screens/university/university_locations_screen.dart \
            lib/services/ble/belt_navigation_bridge.dart \
            lib/screens/navigation/live_navigation_screen.dart \
            lib/screens/test/live_navigation_test_screen.dart \
            test/campus_graph_routing_service_test.dart \
            test/route_progress_service_test.dart \
            test/gps_filter_service_test.dart \
            test/navigation_trace_logger_test.dart

      - name: Run unit tests
        run: flutter test --no-pub --reporter expanded
