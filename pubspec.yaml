name: droobi
description: Droobi - Wearable navigation app for visually impaired users.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE communication with the DroobiBelt ESP32.
  flutter_blue_plus: ^1.32.12

  # State management.
  flutter_riverpod: ^2.5.1

  # Firebase Authentication + Firestore.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Destination search.
  http: ^1.2.1

  # Voice input.
  speech_to_text: ^7.5.0

  # TTS/audio feedback.
  flutter_tts: ^4.0.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/home_bg.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21